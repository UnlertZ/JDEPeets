{% extends 'base.html' %}
{% block title %}เข้าสู่ระบบ – ถังดับเพลิง{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">

    <!-- Card -->
    <div class="card shadow border-0 rounded-4 overflow-hidden">

      <!-- Header -->
      <div class="card-header text-white text-center py-4 border-0" style="background:#C62828">
        <div class="fs-1 mb-1">🔥</div>
        <h4 class="mb-0 fw-bold">เข้าสู่ระบบ</h4>
        <div class="small opacity-75 mt-1">ระบบจัดการถังดับเพลิง</div>
      </div>

      <!-- Body -->
      <div class="card-body p-4">
        <form method="post" novalidate>

          <!-- Username -->
          <div class="mb-3">
            <label class="form-label fw-semibold small text-secondary">
              <i class="bi bi-person-fill me-1"></i>ชื่อผู้ใช้
            </label>
            <input type="text" name="username"
                   class="form-control form-control-lg"
                   placeholder="กรอกชื่อผู้ใช้"
                   autocomplete="username"
                   required autofocus />
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold small text-secondary">
              <i class="bi bi-lock-fill me-1"></i>รหัสผ่าน
            </label>
            <div class="input-group">
              <input type="password" name="password" id="passwordInput"
                     class="form-control form-control-lg"
                     placeholder="กรอกรหัสผ่าน"
                     autocomplete="current-password"
                     required />
              <button type="button" class="btn btn-outline-secondary" id="togglePwd"
                      tabindex="-1">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit"
                  class="btn btn-lg w-100 fw-semibold text-white"
                  style="background:#C62828">
            <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
          </button>
        </form>

        <hr class="my-3" />

        <div class="text-center">
          <a href="{{ url_for('index') }}" class="text-secondary small text-decoration-none">
            <i class="bi bi-eye me-1"></i>ดูข้อมูลโดยไม่เข้าสู่ระบบ
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('togglePwd').addEventListener('click', function () {
  var inp  = document.getElementById('passwordInput');
  var icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
});
</script>
{% endblock %}
