<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แก้ไขข้อมูลถังดับเพลิง | FireTank</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm sticky-top">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="images/jdepeets_logo.svg" alt="JDE Peet's" height="36" style="filter: brightness(0) invert(1);">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="index.html">
              <i class="bi bi-speedometer2 me-1"></i>แดชบอร์ด
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="check.html">
              <i class="bi bi-clipboard2-check me-1"></i>ตรวจเช็คถัง
            </a>
          </li>
        </ul>

        <div id="navbarAuthArea" class="d-flex align-items-center gap-2">
          <a href="register.html" class="btn btn-outline-light btn-sm fw-semibold">
            <i class="bi bi-person-plus me-1"></i>ลงทะเบียน
          </a>
          <a href="login.html" class="btn btn-warning btn-sm fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Flash Message Container -->
  <div class="container-fluid px-3 px-md-4 mt-3" id="flashAlertArea"></div>

  <!-- Main Content -->
  <main class="container py-4 flex-grow-1" style="max-width: 860px;">

    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-header bg-warning text-dark py-3 px-4 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-pencil-square fs-4"></i>
          <div>
            <h5 class="mb-0 fw-bold">แก้ไขข้อมูลถังดับเพลิง: <span id="headerTankId" class="text-danger"></span></h5>
            <small class="text-muted">ปรับปรุงข้อมูลในฐานข้อมูล (เฉพาะ Admin P2)</small>
          </div>
        </div>
        <a href="index.html" class="btn btn-outline-dark btn-sm">
          <i class="bi bi-arrow-left me-1"></i>กลับหน้าหลัก
        </a>
      </div>

      <div class="card-body p-4">
        <form id="editTankForm" onsubmit="handleEditSubmit(event)">

          <!-- Row 1: FireTank ID & Type -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold small">
                รหัสถัง (FireTank)
              </label>
              <input type="text" id="tankIdInput" class="form-control text-uppercase fw-bold text-danger bg-light" readonly />
            </div>

            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold small">ประเภทถัง (Types)</label>
              <input type="text" id="typeInput" class="form-control" list="typeList" placeholder="พิมพ์หรือเลือกประเภท" />
              <datalist id="typeList"></datalist>
            </div>
          </div>

          <!-- Row 2: Weight & Area -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-4">
              <label class="form-label fw-semibold small">น้ำหนักถัง (Weight lb)</label>
              <div class="input-group">
                <input type="number" step="0.1" id="weightInput" class="form-control" />
                <span class="input-group-text">lb</span>
              </div>
            </div>

            <div class="col-12 col-sm-8">
              <label class="form-label fw-semibold small">พื้นที่ติดตั้ง (Area)</label>
              <input type="text" id="areaInput" class="form-control" list="areaList" placeholder="เช่น Solar WH หรือ Meeting room" />
              <datalist id="areaList"></datalist>
            </div>
          </div>

          <!-- Row 3: Inuse + Lastcheck + Inspector + Responsible -->
          <div class="row g-3 mb-3">
            <div class="col-6 col-sm-3">
              <label class="form-label fw-semibold small">วันที่เริ่มใช้งาน</label>
              <input type="text" id="inuseInput" class="form-control" placeholder="01/01/2022" />
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label fw-semibold small">เวลาตรวจล่าสุด</label>
              <input type="text" id="lastcheckInput" class="form-control" placeholder="2026-09-29 15:20" />
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label fw-semibold small">ผู้ตรวจ (Inspector)</label>
              <input type="text" id="inspectorInput" class="form-control" placeholder="ชื่อผู้ตรวจ" />
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label fw-semibold small">ผู้รับผิดชอบ (Responsible)</label>
              <input type="text" id="responsibleInput" class="form-control" placeholder="ชื่อผู้รับผิดชอบ" />
            </div>
          </div>

          <!-- Row 3b: Tankcheck -->
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label fw-semibold small">สถานะการตรวจ</label>
              <div class="d-flex gap-3 mt-1">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="Tankcheck" id="chkYes" value="เช็คแล้ว" />
                  <label class="form-check-label text-success fw-semibold small" for="chkYes">เช็คแล้ว</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="Tankcheck" id="chkNo" value="ยังไม่เช็ค" />
                  <label class="form-check-label text-warning fw-semibold small" for="chkNo">ยังไม่เช็ค</label>
                </div>
              </div>
            </div>
          </div>

          <!-- Row 4: Images -->
          <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold small">
                <i class="bi bi-image me-1"></i>รูปถ่ายถังดับเพลิง (PicTank)
              </label>
              <div id="currentPicTankBox" class="mb-2 d-none">
                <img id="currentPicTankImg" src="" class="img-thumbnail" style="max-height: 100px;" />
              </div>
              <input type="file" id="picTankFile" accept="image/*" class="form-control form-control-sm" onchange="previewUpload(event, 'previewTank')" />
              <img id="previewTank" src="" class="img-thumbnail mt-2 d-none" style="max-height: 100px;" />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label fw-semibold small">
                <i class="bi bi-geo-alt me-1"></i>รูปถ่ายบริเวณพื้นที่ (PicArea)
              </label>
              <div id="currentPicAreaBox" class="mb-2 d-none">
                <img id="currentPicAreaImg" src="" class="img-thumbnail" style="max-height: 100px;" />
              </div>
              <input type="file" id="picAreaFile" accept="image/*" class="form-control form-control-sm" onchange="previewUpload(event, 'previewArea')" />
              <img id="previewArea" src="" class="img-thumbnail mt-2 d-none" style="max-height: 100px;" />
            </div>
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-between align-items-center pt-3 border-top">
            <a href="index.html" class="btn btn-outline-secondary">
              <i class="bi bi-x-circle me-1"></i>ยกเลิก
            </a>
            <button type="submit" class="btn btn-warning px-4 shadow fw-bold">
              <i class="bi bi-check-circle me-1"></i>บันทึกการแก้ไข
            </button>
          </div>

        </form>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white text-muted py-3 mt-4 text-center small shadow-sm">
    <div class="container">
      <span>🔥 FireTank Inspection System — Online Cloud Edition</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let uploadedPicTankBase64 = null;
    let uploadedPicAreaBase64 = null;
    let currentTankId = null;

    async function previewUpload(event, previewId) {
      const file = event.target.files[0];
      if (file) {
        const compressedBase64 = await compressImage(file, 1200, 0.75);
        if (previewId === 'previewTank') uploadedPicTankBase64 = compressedBase64;
        if (previewId === 'previewArea') uploadedPicAreaBase64 = compressedBase64;
        const img = document.getElementById(previewId);
        img.src = compressedBase64;
        img.classList.remove('d-none');
      }
    }

    function initPage() {
      // ตรวจสอบสิทธิ์ (เฉพาะ Admin P2)
      if (!requireAuth(2)) return;

      const urlParams = new URLSearchParams(window.location.search);
      currentTankId = urlParams.get('tank_id');
      if (!currentTankId) {
        alert('กรุณาระบุรหัสถังที่ต้องการแก้ไข');
        window.location.href = 'index.html';
        return;
      }

      const tank = getTankById(currentTankId);
      if (!tank) {
        alert(`ไม่พบข้อมูลถัง ${currentTankId}`);
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('headerTankId').innerText = tank.FireTank;
      document.getElementById('tankIdInput').value = tank.FireTank;
      document.getElementById('typeInput').value = tank.Types || '';
      document.getElementById('weightInput').value = tank['Weight (lb)'] ?? '';
      document.getElementById('areaInput').value = tank.Area || '';
      document.getElementById('inuseInput').value = tank.Inuse || '';
      document.getElementById('lastcheckInput').value = tank.Lastcheck || '';
      document.getElementById('inspectorInput').value = tank.Inspector || '';
      document.getElementById('responsibleInput').value = tank.Responsible || '';

      if (tank.Tankcheck === 'เช็คแล้ว') {
        document.getElementById('chkYes').checked = true;
      } else {
        document.getElementById('chkNo').checked = true;
      }

      // แสดงรูปเดิม
      if (tank.PicTank) {
        const pSrc = tank.PicTank.startsWith('data:') ? tank.PicTank : (tank.PicTank.startsWith('static/') ? tank.PicTank : 'static/' + tank.PicTank);
        document.getElementById('currentPicTankImg').src = pSrc;
        document.getElementById('currentPicTankBox').classList.remove('d-none');
      }
      if (tank.PicArea) {
        const aSrc = tank.PicArea.startsWith('data:') ? tank.PicArea : (tank.PicArea.startsWith('static/') ? tank.PicArea : 'static/' + tank.PicArea);
        document.getElementById('currentPicAreaImg').src = aSrc;
        document.getElementById('currentPicAreaBox').classList.remove('d-none');
      }

      // Dropdown Datalists
      const tanks = getAllTanks();
      const types = [...new Set(tanks.map(t => t.Types).filter(Boolean))].sort();
      const areas = [...new Set(tanks.map(t => t.Area).filter(Boolean))].sort();

      const typeList = document.getElementById('typeList');
      const areaList = document.getElementById('areaList');
      types.forEach(t => typeList.appendChild(new Option(t, t)));
      areas.forEach(a => areaList.appendChild(new Option(a, a)));
    }

    async function handleEditSubmit(e) {
      e.preventDefault();
      const isChecked = document.querySelector('input[name="Tankcheck"]:checked').value;
      const data = {
        Types: document.getElementById('typeInput').value.trim(),
        'Weight (lb)': document.getElementById('weightInput').value,
        Area: document.getElementById('areaInput').value.trim(),
        Inuse: document.getElementById('inuseInput').value.trim(),
        Lastcheck: document.getElementById('lastcheckInput').value.trim(),
        Tankcheck: isChecked,
        ReadyorNot: isChecked === 'เช็คแล้ว' ? 'Ready' : 'Not Ready',
        Inspector: document.getElementById('inspectorInput').value.trim(),
        Responsible: document.getElementById('responsibleInput').value.trim(),
      };

      if (uploadedPicTankBase64) data.PicTank = uploadedPicTankBase64;
      if (uploadedPicAreaBase64) data.PicArea = uploadedPicAreaBase64;

      const res = await updateTank(currentTankId, data);
      if (res.success) {
        sessionStorage.setItem('flash_msg', JSON.stringify({
          type: 'success',
          text: `อัปเดตข้อมูลถัง ${currentTankId} เรียบร้อยแล้ว! ✅`
        }));
        window.location.href = 'index.html';
      } else {
        alert(res.message);
      }
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
