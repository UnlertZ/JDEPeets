<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ | FireTank</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light d-flex flex-column justify-content-between min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
    <div class="container-fluid px-3 px-md-4">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="images/jdepeets_logo.svg" alt="JDE Peet's" height="36" style="filter: brightness(0) invert(1);">
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left me-1"></i>กลับหน้าหลัก
      </a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">

        <div class="card shadow border-0 rounded-4 overflow-hidden">
          <!-- Card Header Banner -->
          <div class="bg-danger text-white text-center py-4 px-3 position-relative">
            <div class="display-5 mb-2" style="color: #FFD166;">
              <i class="bi bi-fire"></i>
            </div>
            <h4 class="fw-bold mb-1 text-white" style="letter-spacing: 0.5px;">เข้าสู่ระบบ FireTank</h4>
            <small class="text-white opacity-90 d-block">กรุณาระบุชื่อผู้ใช้และรหัสผ่านเพื่อจัดการข้อมูล</small>
          </div>

          <!-- Card Body Form -->
          <div class="card-body p-4">

            <!-- Error Alert -->
            <div id="loginErrorAlert" class="alert alert-danger d-none small py-2 mb-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-1"></i><span id="loginErrorText"></span>
            </div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
              <!-- Username -->
              <div class="mb-3">
                <label for="usernameInput" class="form-label fw-semibold small text-secondary">
                  <i class="bi bi-person-fill me-1"></i>ชื่อผู้ใช้ (Username)
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" id="usernameInput" class="form-control" placeholder="เช่น LeaderLinePD1" required autofocus />
                </div>
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label for="passwordInput" class="form-label fw-semibold small text-secondary">
                  <i class="bi bi-lock-fill me-1"></i>รหัสผ่าน (Password)
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                  <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required />
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                  </button>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-danger btn-lg fw-semibold shadow-sm">
                  <i class="bi bi-box-arrow-in-right me-1"></i>เข้าสู่ระบบ
                </button>
              </div>

              <!-- Register Button Link -->
              <div class="d-grid mb-3">
                <a href="register.html" class="btn btn-outline-danger fw-semibold">
                  <i class="bi bi-person-plus me-1"></i>ยังไม่มีบัญชี? ลงทะเบียนสมาชิกใหม่
                </a>
              </div>

              <!-- Guest Back Link -->
              <div class="text-center">
                <a href="index.html" class="text-decoration-none text-muted small">
                  <i class="bi bi-eye me-1"></i>เข้าดูข้อมูลอย่างเดียวโดยไม่ต้องเข้าสู่ระบบ
                </a>
              </div>
            </form>

          </div>



        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white text-muted py-3 text-center small shadow-sm">
    <div class="container">
      <span>🔥 FireTank Inspection System — Online Cloud Edition</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/auth.js"></script>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('toggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }



    async function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('usernameInput').value;
      const p = document.getElementById('passwordInput').value;
      const errBox = document.getElementById('loginErrorAlert');
      const errText = document.getElementById('loginErrorText');

      const res = await login(u, p);
      if (res.success) {
        sessionStorage.setItem('flash_msg', JSON.stringify({
          type: 'success',
          text: `ยินดีต้อนรับ คุณ ${res.user.EmName || res.user.Username}! 🎉`
        }));
        window.location.href = 'index.html';
      } else {
        errBox.classList.remove('d-none');
        errText.innerText = res.message;
      }
    }

    // ถ้าล็อกอินอยู่แล้ว ให้กลับหน้าแรก
    if (getCurrentUser()) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
